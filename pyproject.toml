[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "dj-library-tool"
version = "0.1.0a14"
description = "From a DJ set's tracklist to a rekordbox playlist and a verified USB stick, using the music you own. CLI and MCP tools."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "uneasymusings" }]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = [
  "alembic>=1.15,<2",
  "fastapi>=0.115,<1",
  "filelock>=3.17,<4",
  "httpx>=0.28,<1",
  "mcp>=2,<3",
  "mutagen>=1.47,<2",
  "pydantic>=2.10,<3",
  "rich>=13.7,<15",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
djlib = "djlib.interfaces.cli:main"

[project.optional-dependencies]
download = ["yt-dlp[default]>=2026.1.1"]

[project.urls]
Repository = "https://github.com/uneasymusings/dj-library-tool"
Issues = "https://github.com/uneasymusings/dj-library-tool/issues"

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/djlib"]

[tool.hatch.build.targets.wheel.force-include]
"skills/dj-library" = "djlib/resources/skills/dj-library"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "fastapi.Query"]
