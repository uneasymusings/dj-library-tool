name: Tests, quality, and packaging

on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.26'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        run: uv sync --locked --extra download
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        run: brew list ffmpeg || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Require audio dependencies
        run: uv run --locked python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
      - name: Lint
        run: uv run --locked ruff check src scripts tests
      - name: Formatting
        run: uv run --locked ruff format --check src scripts tests
      - name: Runtime, CLI, and MCP tests
        run: uv run --locked pytest -q
      - name: Build distributable artifacts
        run: uv build
      - name: Exercise installed wheel in a fresh environment
        run: uv run --locked python scripts/check_distribution.py
      - name: Package portable skill and checksums
        run: uv run --locked python scripts/release_artifacts.py
