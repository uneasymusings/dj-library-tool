name: Tests, quality, and packaging

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

# A newer push to the same branch or pull request supersedes a running check.
concurrency:
  group: quality-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    # Windows test steps take 10-20 minutes, but one slow runner was only 60% through after
    # 23 minutes (on pace for about 35) and hit the old 25-minute limit; leave headroom.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.26'
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install locked dependencies
        # The one-line installer puts djlib on Python 3.12 with song recognition (shazamio, whose
        # signing library shazamio-core has wheels for all three systems there), so the 3.12 jobs
        # install it as well. Tests still treat Shazam as not installed unless they bring a fake;
        # the step after them checks the real one (scripts/check_recognition.py).
        run: uv sync --locked --extra download ${{ matrix.python == '3.12' && '--extra recognize' || '' }}
      - name: Install FFmpeg on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install FFmpeg on macOS
        if: runner.os == 'macOS'
        # `brew list ffmpeg` posts a red "No such keg" annotation when it isn't there yet.
        run: brew list --versions ffmpeg >/dev/null 2>&1 || brew install ffmpeg
      - name: Install FFmpeg on Windows
        if: runner.os == 'Windows'
        run: choco install ffmpeg -y --no-progress
      - name: Require audio dependencies
        run: uv run --locked python -c "import shutil; assert shutil.which('ffmpeg') and shutil.which('ffprobe')"
      - name: Lint
        run: uv run --locked ruff check src scripts tests
      - name: Formatting
        run: uv run --locked ruff format --check src scripts tests
      - name: Runtime, CLI, and MCP tests
        run: uv run --locked pytest -q --durations=10
      - name: Song recognition works offline
        if: matrix.python == '3.12'
        run: uv run --locked python scripts/check_recognition.py
      - name: Build distributable artifacts
        run: uv build
      - name: Exercise installed wheel in a fresh environment
        run: uv run --locked python scripts/check_distribution.py
      - name: Package portable skill and checksums
        run: uv run --locked python scripts/release_artifacts.py
