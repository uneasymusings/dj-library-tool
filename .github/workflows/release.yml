name: Validate and draft a release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  validate:
    uses: ./.github/workflows/quality.yml
  draft:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: '0.9.26'
          python-version: '3.13'
      - name: Check tag matches packaged version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project python -c "import os,tomllib,pathlib; version=tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']; assert os.environ['RELEASE_TAG']=='v'+version"
      - name: Build exact release artifacts
        run: |
          uv sync --locked --extra download
          uv build
          uv run --locked python scripts/check_distribution.py
          uv run --locked python scripts/release_artifacts.py
      - name: Create draft with verified artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          release_version="${RELEASE_TAG#v}"
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --generate-notes --title "DJ Library Tool $RELEASE_TAG" \
            "dist/dj_library_tool-${release_version}-py3-none-any.whl" \
            "dist/dj_library_tool-${release_version}.tar.gz" \
            "dist/dj-library-skill-${release_version}.zip" \
            dist/SHA256SUMS
